[project]
name = "fudz-api-v2"
version = "0.1.0"
description = "Fudz food-delivery backend v2: FastAPI + SQLModel + PostGIS rewrite of the Django/DRF v1."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
    "geoalchemy2>=0.15",
    "shapely>=2.0",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "firebase-admin>=6.5",
    "boto3>=1.34",
    "httpx>=0.27",
    "structlog>=24.1",
    "prometheus-fastapi-instrumentator>=7.0",
    "slowapi>=0.1.9",
    "email-validator>=2.0",
    "humanize>=4.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-passlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RET", "TID"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"migrations/**/*.py" = ["E501", "B008"]
"tests/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = true
# db bootstrap code is exercised lazily via routers; required→not enforced by
# 80% threshold in this phase (Phase 1 exercises it for real).
omit = [
    "app/db/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
